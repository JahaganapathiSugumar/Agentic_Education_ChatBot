<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahayak — Sign In</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #212121;
            --card: #2f2f2f;
            --border: #3f3f3f;
            --input-bg: #3a3a3a;
            --text: #ececec;
            --muted: #8e8ea0;
            --accent: #10a37f;
            --accent-hover: #0d8c6d;
            --danger: #ef4444;
            --radius: 12px;
        }
        html, body {
            min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        /* ── Background mesh ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 20%, rgba(16,163,127,.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 80% 80%, rgba(91,91,214,.10) 0%, transparent 60%);
            pointer-events: none;
        }

        .page-wrap {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            padding: 24px 16px;
            animation: fadeUp .35s ease;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

        /* ── Logo ── */
        .logo-row {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            margin-bottom: 28px; text-align: center;
        }
        .logo-circle {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--accent);
            display: flex; align-items: center; justify-content: center;
        }
        .logo-row h1 { font-size: 22px; font-weight: 700; }
        .logo-row p { font-size: 13px; color: var(--muted); }

        /* ── Card ── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px 28px 24px;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1; background: none; border: none; color: var(--muted);
            font-size: 14px; font-weight: 600; padding: 0 0 12px;
            cursor: pointer; border-bottom: 2px solid transparent;
            transition: color .2s, border-color .2s;
        }
        .tab-btn.active { color: var(--text); border-color: var(--accent); }

        /* ── Role selector ── */
        .role-row {
            display: flex; gap: 10px; margin-bottom: 18px;
        }
        .role-btn {
            flex: 1; background: var(--input-bg); border: 1.5px solid var(--border);
            color: var(--muted); border-radius: 8px; padding: 10px 8px;
            cursor: pointer; font-size: 13px; font-weight: 600; text-align: center;
            transition: all .2s; display: flex; flex-direction: column;
            align-items: center; gap: 5px;
        }
        .role-btn .role-icon { font-size: 20px; }
        .role-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(16,163,127,.1); }

        /* ── Form ── */
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
        input[type=text], input[type=email], input[type=password] {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border);
            color: var(--text); border-radius: 8px; padding: 11px 14px;
            font-size: 14px; outline: none; transition: border-color .2s;
        }
        input::placeholder { color: var(--muted); }
        input:focus { border-color: var(--accent); }

        /* ── Password wrapper ── */
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 42px; }
        .pw-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--muted);
            display: flex; align-items: center; padding: 0;
        }
        .pw-toggle:hover { color: var(--text); }

        /* ── Submit btn ── */
        .submit-btn {
            width: 100%; padding: 12px; background: var(--accent);
            color: #fff; border: none; border-radius: 8px; font-size: 15px;
            font-weight: 600; cursor: pointer; margin-top: 6px;
            transition: background .2s, opacity .2s;
        }
        .submit-btn:hover { background: var(--accent-hover); }
        .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ── Error / info message ── */
        .msg-box {
            border-radius: 8px; padding: 10px 14px; font-size: 13px;
            margin-bottom: 14px; display: none;
        }
        .msg-box.error   { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
        .msg-box.success { background: rgba(16,163,127,.12); border: 1px solid rgba(16,163,127,.3); color: #6ee7b7; }
        .msg-box.visible { display: block; }

        /* ── Loader spinner inside btn ── */
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
            border-radius: 50%; animation: spin .7s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer ── */
        .card-footer {
            text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <!-- Logo -->
    <div class="logo-row">
        <div class="logo-circle">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a9 9 0 1 0 9 9"/>
                <path d="M12 6v6l4 2"/>
                <circle cx="20" cy="4" r="3" fill="white" stroke="none"/>
            </svg>
        </div>
        <h1>Sahayak AI</h1>
        <p>AI Teaching Assistant</p>
    </div>

    <!-- Card -->
    <div class="card">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-login"  onclick="switchTab('login')">Log in</button>
            <button class="tab-btn"        id="tab-signup" onclick="switchTab('signup')">Sign up</button>
        </div>

        <!-- Message box -->
        <div class="msg-box" id="msg-box"></div>

        <!-- ── LOGIN FORM ── -->
        <form id="login-form" onsubmit="doLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="l-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="pw-wrap">
                    <input type="password" id="l-password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('l-password', this)" title="Show/hide password">
                        <svg id="eye-login" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button class="submit-btn" type="submit" id="login-btn">Log in</button>
        </form>

        <!-- ── SIGNUP FORM ── -->
        <form id="signup-form" style="display:none" onsubmit="doSignup(event)">
            <!-- Role selector -->
            <div class="role-row">
                <button type="button" class="role-btn selected" id="role-teacher" onclick="selectRole('teacher')">
                    <span class="role-icon">👨‍🏫</span>Teacher
                </button>
                <button type="button" class="role-btn" id="role-student" onclick="selectRole('student')">
                    <span class="role-icon">🎓</span>Student
                </button>
            </div>

            <div class="form-group">
                <label>Full name</label>
                <input type="text" id="s-name" placeholder="Your name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="s-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="pw-wrap">
                    <input type="password" id="s-password" placeholder="Min. 6 characters" required autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('s-password', this)" title="Show/hide password">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button class="submit-btn" type="submit" id="signup-btn">Create account</button>
        </form>

        <div class="card-footer">
            Sahayak AI &mdash; Empowering Education
        </div>
    </div>
</div>

<script>
let selectedRole = 'teacher';

function switchTab(tab) {
    clearMsg();
    document.getElementById('login-form').style.display  = tab === 'login'  ? '' : 'none';
    document.getElementById('signup-form').style.display = tab === 'signup' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
}

function selectRole(role) {
    selectedRole = role;
    document.getElementById('role-teacher').classList.toggle('selected', role === 'teacher');
    document.getElementById('role-student').classList.toggle('selected', role === 'student');
}

function showMsg(text, type) {
    const box = document.getElementById('msg-box');
    box.textContent = text;
    box.className = `msg-box ${type} visible`;
}
function clearMsg() {
    const box = document.getElementById('msg-box');
    box.className = 'msg-box';
}

function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.querySelector('svg').style.opacity = show ? '1' : '0.4';
}

function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading
        ? '<span class="spinner"></span> Please wait…'
        : (btnId === 'login-btn' ? 'Log in' : 'Create account');
}

async function doLogin(e) {
    e.preventDefault();
    clearMsg();
    const email    = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-password').value;
    setLoading('login-btn', true);
    try {
        const res  = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || 'Login failed', 'error'); return; }
        // Redirect based on role with loaded parameter to trigger history load
        window.location.href = data.role === 'teacher' ? '/?loaded=true' : '/coming-soon?loaded=true';
    } catch {
        showMsg('Network error. Please try again.', 'error');
    } finally {
        setLoading('login-btn', false);
    }
}

async function doSignup(e) {
    e.preventDefault();
    clearMsg();
    const name     = document.getElementById('s-name').value.trim();
    const email    = document.getElementById('s-email').value.trim();
    const password = document.getElementById('s-password').value;
    const role     = selectedRole;
    setLoading('signup-btn', true);
    try {
        const res  = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role })
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || 'Signup failed', 'error'); return; }
        window.location.href = data.role === 'teacher' ? '/?loaded=true' : '/coming-soon?loaded=true';
    } catch {
        showMsg('Network error. Please try again.', 'error');
    } finally {
        setLoading('signup-btn', false);
    }
}
</script>
</body>
</html>
